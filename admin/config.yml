  - name: "hygiene-care"
    label: "ჰიგიენა & მოვლა"
    description: "ჰიგიენა & მოვლა — აქ დაამატე ახალი პროდუქტი ან შეცვალე არსებული."
    files:
      - name: catalog
        label: პროდუქცია
        file: products/categories/hygiene-care.json
        format: json
        fields:
          - label: პროდუქტების ჩამონათვალი
            name: products
            widget: list
            summary: '{{fields.title}} — {{fields.price}} ₾'
            hint: "ახალი პროდუქტის დასამატებლად დააჭირე დამატებას; რედაქტირებისთვის აირჩიე პროდუქტი სიიდან."
            fields:
              - { label: კატეგორია, name: category, widget: hidden, default: "ჰიგიენა & მოვლა" }
              - { label: პროდუქტის სახელი, name: title, widget: string, hint: "ჩაწერე პროდუქტის სახელი." }
              - { label: ბმულის იდენტიფიკატორი (არასავალდებულო), name: slug, widget: string, required: false, hint: "შეგიძლია ცარიელი დატოვო — ბმული სახელიდან შეიქმნება." }
              - { label: ფასი (₾), name: price, widget: number, value_type: float, min: 0 }
              - { label: ძველი ფასი (არასავალდებულო), name: oldPrice, widget: number, value_type: float, min: 0, required: false }
              - { label: აღწერა, name: description, widget: text, hint: "ჩაწერე პროდუქტის აღწერა ჩვეულებრივი ტექსტით." }
              - label: ზომა
                name: size
                widget: select
                default: "არ აქვს"
                options: ["არ აქვს", "ძალიან პატარა", "პატარა", "საშუალო", "დიდი"]
                hint: "თუ პროდუქტს ზომა არ აქვს, აირჩიე „არ აქვს“."
              - label: ფერი
                name: colors
                widget: select
                required: false
                multiple: true
                options: ["ყავისფერი", "ტერაკოტა", "ლურჯი", "მწვანე", "ლავანდისფერი", "ვარდისფერი", "ღია ყავისფერი", "ბორდოსფერი", "შავი"]
                hint: "შეგიძლია მონიშნო პროდუქტის ყველა ხელმისაწვდომი ფერი."
              - label: ფოტოები (არჩევითი)
                name: photos
                widget: list
                required: false
                min: 0
                max: 1
                label_singular: ფოტოების დამატება
                typeKey: source
                types:
                  - label: გალერეიდან ატვირთვა
                    name: gallery
                    widget: object
                    fields:
                      - label: აირჩიე ფოტოები
                        name: images
                        widget: list
                        label_singular: ფოტოს დამატება
                        field: { label: ფოტო, name: image, widget: image, choose_url: false }
                  - label: ფოტოს ბმულების ჩასმა
                    name: links
                    widget: object
                    fields:
                      - { label: ფოტოს ბმული 1 (პირდაპირი URL), name: link1, widget: string, required: false, pattern: ['^(https://.+)?$', 'ჩასვი სრული https:// სურათის ბმული.'] }
                      - { label: ფოტოს ბმული 2 (პირდაპირი URL), name: link2, widget: string, required: false, pattern: ['^(https://.+)?$', 'ჩასვი სრული https:// სურათის ბმული.'] }
                      - { label: ფოტოს ბმული 3 (პირდაპირი URL), name: link3, widget: string, required: false, pattern: ['^(https://.+)?$', 'ჩასვი სრული https:// სურათის ბმული.'] }
                      - { label: ფოტოს ბმული 4 (პირდაპირი URL), name: link4, widget: string, required: false, pattern: ['^(https://.+)?$', 'ჩასვი სრული https:// სურათის ბმული.'] }
              - { label: სხვა მახასიათებლები (არასავალდებულო), name: attributes, widget: list, required: false }
              - { label: საიტზე გამოჩენა, name: published, widget: boolean, default: true }
