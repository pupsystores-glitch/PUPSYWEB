<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="192x192" href="https://pupsystores-glitch.github.io/PUPSYWEB/images/pupsy-icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="https://pupsystores-glitch.github.io/PUPSYWEB/images/pupsy-icon-192.png">
  <title>PUPSY CMS ავტორიზაცია</title>
</head>
<body>
  <p id="message">ავტორიზაცია სრულდება…</p>
  <script>
    (() => {
      const params = new URLSearchParams(location.hash.slice(1));
      const token = params.get('oauth_token');
      const adminUrl = new URL('./', location.href);
      if (!token) {
        location.replace(adminUrl.href);
        return;
      }
      try {
        sessionStorage.setItem('pupsy_github_token', token);
        history.replaceState(null, '', location.pathname + location.search);
        location.replace(adminUrl.href);
      } catch {
        document.getElementById('message').textContent = 'ავტორიზაციის შენახვა ვერ მოხერხდა. სცადეთ თავიდან.';
      }
    })();
  </script>
</body>
</html>
